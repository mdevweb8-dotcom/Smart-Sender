name: Unzip
on: [push, workflow_dispatch]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o "smart-sender-nov-14-2026-11-01-38-am (1).zip" -d temp_unzip
          cp -r temp_unzip/. .
          rm -rf temp_unzip "smart-sender-nov-14-2026-11-01-38-am (1).zip"
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "فك ضغط المشروع"
