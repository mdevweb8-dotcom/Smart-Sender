name: Unzip
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o "smart-sender-nov-14-2026-11-01-38-am (1).zip" -d temp_unzip || echo "already unzipped"
          rm -rf temp_unzip/.github
          cp -r temp_unzip/. . || true
          rm -rf temp_unzip "smart-sender-nov-14-2026-11-01-38-am (1).zip" || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "فك ضغط المشروع"
